name: Scripts

on:
  push:
    branches:
      - main
  pull_request:

jobs:

  test-json-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          # Pinned: the scripts' locked dependencies (rpds-py, numpy, pyarrow,
          # shapely, ...) do not ship wheels for Python 3.15 yet, and building
          # them from source fails on the runner. Bump once wheels are available.
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v7

      - name: Install geospatial dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libproj-dev libgdal-dev

      - name: Run scripts
        run: |
          cd scripts
          uv run pytest test_json_schema.py -v
          uv run pytest test_example.py -v
          uv run python generate_example.py
          uv run python update_example_schemas.py
          cd ../examples
          # Assert that the version number and file metadata are up to date
          # Allow for differences in example.parquet
          git restore example.parquet
          git diff
          test -z "$(git status --porcelain)"
